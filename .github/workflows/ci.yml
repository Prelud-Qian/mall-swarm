name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装依赖模块（跳过测试）
        working-directory: mall-swarm-backend
        run: mvn -B -pl mall-common,mall-mbg -am install -DskipTests=true

      - name: 运行单元测试（秒杀 + 缓存三兄弟，全Mock无外部依赖）
        working-directory: mall-swarm-backend
        run: mvn -B -pl mall-portal test -DskipTests=false -Dtest=FlashPromotionOrderServiceImplTest,PmsPortalProductServiceImplTest
