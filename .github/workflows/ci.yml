name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 编译并运行单元测试（秒杀 + 缓存三兄弟，全Mock无外部依赖）
        working-directory: mall-swarm-backend
        run: mvn -B -pl mall-portal -am test -DskipTests=false -DfailIfNoTests=false -Dtest=FlashPromotionOrderServiceImplTest,PmsPortalProductServiceImplTest
